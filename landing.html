<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Namma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="nav-top">

            <div class="nav-top-ele menu">MENU</div>
            <div class="nav-top-ele about">ABOUT</div>
        </nav>
        <nav id="nav-bottom">
            <div class="nav-bottom-ele">WE THINK CRAFT AND DESIGN</div>
            <div class="nav-bottom-ele dynamic">
                <div class="city">Mumbai</div>
                <div class="time" id="clock">11:11 AM</div>
            </div>
        </nav>
    </header>

    <main>
        <section id="section-1">
            <div class="secc-1-div menu-box">
                <div class="menu-col">
                    <div class="menu-nav-link home">
                        <img src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/687f51f589db1d6a1057cde2_shared%20(4).gif">
                        <h1>HOME</h1>
                    </div>
                    <div class="menu-nav-link work">
                        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeG5nOTk0cWpocDI5Ynhjb2txeWt5YWE3bnY5b2pibDlrYmJ5azc4ZCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/fTQsxB2QLNDDa/giphy.gif">
                        <h1>WORK</h1>
                    </div>
                    <div class="menu-nav-link service">
                        <img src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/687f52905775f96448c20208_shared%20(8).gif">
                        
                        <h1>SEVICES</h1>
                    </div>
                    <div class="menu-nav-link approch">
                        <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3NzhxaGlqcmw5a25xemlmcjduNHpnbHlrYTNqN2tkdTl1Y2tsYjY0YyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/ryMH0VcZVZg9a/giphy.gif">

                    </div>
                </div>
                <div class="menu-col">
                    <div class="menu-nav-link studio">
                        <img src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/687f52743978d71c86ce864a_shared%20(7).gif">
                        <h1>STUDIO</h1>
                    </div>
                    <div class="menu-nav-link plans">
                        <img src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/687f53340fd0b3d13f6ce6ec_shared%20(10).gif">
                        <h1>PLANS</h1>

                    </div>
                    <div class="menu-nav-link news">
                        <img src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/687f539812c66351fb6ee1cc_shared%20(11).gif">
                        <h1>NEWS</h1>
                    </div>
                </div>
            </div>
            
            <!-- Video Cursor Container -->
            <div class="secc-1-div cursor-box">
                <video
                    src="https://res.cloudinary.com/dwufrkldm/video/upload/q_auto/f_auto/v1779539092/cursor_eocdmw.mp4"
                    autoplay
                    muted
                    loop
                    playsinline
                    class="hero-vid"
                ></video>
            </div>

            <div class="secc-1-div front-page">
                <div id="text-box">
                    
                    <!-- Line 1: WE THINK -->
                    <div class="text-line line-1">
                        <div class="text-word">
                            <div class="word-letter">W</div>
                            <div class="word-letter">E</div>
                        </div>
                        <div class="text-word">
                            <div class="word-letter">T</div>
                            <div class="word-letter">H</div>
                            <div class="word-letter">I</div>

                            <div class="word-letter">K</div>

                    </div>

                    <!-- Line 2: CRAFT AND -->
                    <div class="text-line line-2">
                        <div class="text-word">

                    <div class="text-line line-3">
                        <div class="text-word">
                            <div class="word-letter">D</div>
                            <div class="word-letter">E</div>
                            <div class="word-letter">S</div>
                            <div class="word-letter">I</div>
                            <div class="word-letter">G</div>
                            <div class="word-letter">N</div>
                        </div>
                    </div>

                </div>
