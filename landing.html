<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Namma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="nav-top">
            <div class="nav-top-ele logo">Studio Namma</div>
            <div class="nav-top-ele theme" id="theme-toggle">DARK MODE</div>
            <div class="nav-top-ele menu">MENU</div>
            <div class="nav-top-ele about">ABOUT</div>
        </nav>
        <nav id="nav-bottom">
            <div class="nav-bottom-ele">WE THINK CRAFT AND DESIGN</div>
            <div class="nav-bottom-ele dynamic">
                <div class="city">Mumbai</div>
                <div class="time" id="clock">11:11 AM</div>
            </div>
        </nav>
    </header>

    <main>
        <section id="section-1">
            <div class="secc-1-div menu-box">
                <div class="menu-col">
                    <div class="menu-nav-link home">
                        <h1>HOME</h1>
                    </div>
                    <div class="menu-nav-link work">
                        <h1>WORK</h1>
                    </div>
                    <div class="menu-nav-link service">
                        <h1>SEVICES</h1>
                    </div>
                    <div class="menu-nav-link approch">
                        <h1>APPROCH</h1>
                    </div>
                </div>
                <div class="menu-col">
                    <div class="menu-nav-link studio">
                        <h1>STUDIO</h1>
                    </div>
                    <div class="menu-nav-link plans">
                        <h1>PLANS</h1>
                    </div>
                    <div class="menu-nav-link news">
                        <h1>NEWS</h1>
                    </div>
                </div>
            </div>
            
            <!-- Video Cursor Container -->
            <div class="secc-1-div cursor-box">
                <video
                    src="https://res.cloudinary.com/dwufrkldm/video/upload/q_auto/f_auto/v1779539092/cursor_eocdmw.mp4"
                    autoplay
                    muted
                    loop
                    playsinline
                    class="hero-vid"
                ></video>
            </div>

            <div class="secc-1-div front-page">
                <div id="text-box">
                    
                    <!-- Line 1: WE THINK -->
                    <div class="text-line line-1">
                        <div class="text-word">
                            <div class="word-letter">W</div>
                            <div class="word-letter">E</div>
                        </div>
                        <div class="text-word">
                            <div class="word-letter">T</div>
                            <div class="word-letter">H</div>
                            <div class="word-letter">I</div>
                            <div class="word-letter">N</div>
                            <div class="word-letter">K</div>
                        </div>
                    </div>

                    <!-- Line 2: CRAFT AND -->
                    <div class="text-line line-2">
                        <div class="text-word">
                            <div class="word-letter">C</div>
                            <div class="word-letter">R</div>
                            <div class="word-letter">A</div>
                            <div class="word-letter">F</div>
                            <div class="word-letter">T</div>
                        </div>
                        <div class="text-word">
                            <div class="word-letter">A</div>
                            <div class="word-letter">N</div>
                            <div class="word-letter">D</div>
                        </div>
                    </div>

                    <!-- Line 3: DESIGN -->
                    <div class="text-line line-3">
                        <div class="text-word">
                            <div class="word-letter">D</div>
                            <div class="word-letter">E</div>
                            <div class="word-letter">S</div>
                            <div class="word-letter">I</div>
                            <div class="word-letter">G</div>
                            <div class="word-letter">N</div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
